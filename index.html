<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Telegram Channel</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #080b14;
    color: white;
}

.card {
    width: 90%;
    max-width: 400px;
    padding: 35px 22px;
    text-align: center;
    background: #111827;
    border: 1px solid #26364d;
    border-radius: 20px;
    box-shadow: 0 0 30px #229ed933;
}

.icon {
    font-size: 65px;
    margin-bottom: 20px;
}

h1 {
    font-size: 27px;
    margin-bottom: 15px;
}

p {
    color: #b8c4d9;
    line-height: 1.6;
    margin-bottom: 28px;
}

.join-btn {
    display: block;
    padding: 16px 12px;
    background: #229ED9;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 16px;
}

.join-btn:hover {
    background: #087db5;
}

.footer {
    color: #7f8da5;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>
<div class="card">

    <div class="icon">✈️</div>

    <h1>JOIN TELEGRAM CHANNEL</h1>

    <p>
        Join our Telegram channel for the latest updates!
        Click below to join our community.
    </p>

    <a class="join-btn"
       href="https://t.me/+qU1CFhuyEnw1YzY1"
       target="_blank"
       rel="noopener noreferrer">
       ✈️ JOIN TELEGRAM CHANNEL
    </a>

    <div class="footer">
        © 2026 | All Rights Reserved
    </div>

</div>
</body>
</html>
